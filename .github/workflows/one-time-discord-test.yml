name: One-time Discord test

on:
  schedule:
    # 2026-06-07 22:10 KST = 2026-06-07 13:10 UTC.
    # GitHub scheduled workflows can start a few minutes late, so the script
    # accepts a short delivery window below.
    - cron: "10 13 * * *"
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send one-time Discord test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TARGET_DATE_KST="2026-06-07"
          TARGET_HOUR_KST="22"
          TARGET_MINUTE_START="10"
          TARGET_MINUTE_END="30"

          NOW_DATE_KST="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          NOW_HOUR_KST="$(TZ=Asia/Seoul date '+%H')"
          NOW_MINUTE_KST="$(TZ=Asia/Seoul date '+%M')"
          NOW_KST="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"

          if [ "$NOW_DATE_KST" != "$TARGET_DATE_KST" ] || \
             [ "$NOW_HOUR_KST" != "$TARGET_HOUR_KST" ] || \
             [ "$NOW_MINUTE_KST" -lt "$TARGET_MINUTE_START" ] || \
             [ "$NOW_MINUTE_KST" -gt "$TARGET_MINUTE_END" ]; then
            echo "Skipping one-time test. NOW_KST=$NOW_KST TARGET_WINDOW=${TARGET_DATE_KST} ${TARGET_HOUR_KST}:${TARGET_MINUTE_START}-${TARGET_MINUTE_END}"
            exit 0
          fi

          curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"⏰ **GitHub Actions 단발 테스트 알림**\nMac이 꺼져 있어도 GitHub 서버에서 Discord로 전송되는지 확인하는 테스트입니다.\n**목표 시간:** 2026-06-07 22:10 KST\n**실행 시간:** ${NOW_KST} KST\n✅ 이 메시지가 도착하면 클라우드 자동화 경로가 정상입니다.\"}" \
            "$DISCORD_WEBHOOK_URL"
